{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "frontend-sa",
    "namespace": "frontend"
  },
  "automountServiceAccountToken": false
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "frontend-reader",
    "namespace": "frontend"
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods",
        "services"
      ],
      "verbs": [
        "get",
        "list"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "frontend-reader",
    "namespace": "frontend"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "frontend-reader"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "frontend-sa",
      "namespace": "frontend"
    }
  ]
}
