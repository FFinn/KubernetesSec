{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "db-config",
    "namespace": "backend"
  },
  "data": {
    "password": "DEMO_ONLY_password_2026"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "frontend",
    "namespace": "frontend"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "frontend"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "frontend"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "frontend",
            "image": "busybox:1.37.0",
            "command": [
              "sh",
              "-c",
              "while true; do nc -l -p 8080 -e echo lab-frontend; done"
            ],
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "16Mi"
              },
              "limits": {
                "cpu": "200m",
                "memory": "64Mi"
              }
            },
            "env": [
              {
                "name": "DB_PASSWORD",
                "value": "DEMO_ONLY_password_2026"
              }
            ]
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "backend",
    "namespace": "backend"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "backend"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "backend"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "backend",
            "image": "busybox:1.37.0",
            "command": [
              "sh",
              "-c",
              "while true; do nc -l -p 5432 -e echo lab-backend; done"
            ],
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "16Mi"
              },
              "limits": {
                "cpu": "200m",
                "memory": "64Mi"
              }
            },
            "env": [
              {
                "name": "DB_PASSWORD",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "db-config",
                    "key": "password"
                  }
                }
              }
            ],
            "securityContext": {
              "privileged": true
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "backend",
    "namespace": "backend"
  },
  "spec": {
    "selector": {
      "app": "backend"
    },
    "ports": [
      {
        "port": 5432,
        "targetPort": 5432
      }
    ]
  }
}
