{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "name": "psa-privileged-probe",
        "namespace": "backend"
      },
      "spec": {
        "containers": [
          {
            "name": "probe",
            "image": "postgres:15",
            "command": [
              "sleep",
              "60"
            ],
            "securityContext": {
              "privileged": true
            }
          }
        ]
      }
    }
  ]
}
