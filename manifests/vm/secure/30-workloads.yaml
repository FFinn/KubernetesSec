{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "frontend-config",
        "namespace": "frontend"
      },
      "data": {
        "nginx.conf": "pid /tmp/nginx.pid;\nevents { worker_connections 256; }\nhttp {\n  include /etc/nginx/mime.types;\n  default_type application/octet-stream;\n  access_log /dev/stdout;\n  error_log /dev/stderr warn;\n  client_body_temp_path /tmp/client_temp;\n  proxy_temp_path /tmp/proxy_temp;\n  fastcgi_temp_path /tmp/fastcgi_temp;\n  uwsgi_temp_path /tmp/uwsgi_temp;\n  scgi_temp_path /tmp/scgi_temp;\n  server { listen 8080; root /usr/share/nginx/html; location / { index index.html; } }\n}\n"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "frontend",
        "namespace": "frontend"
      },
      "spec": {
        "replicas": 1,
        "revisionHistoryLimit": 2,
        "selector": {
          "matchLabels": {
            "app": "frontend"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "frontend"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "frontend",
                "image": "nginx:1.25",
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "128Mi"
                  }
                },
                "securityContext": {
                  "privileged": false,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "env": [
                  {
                    "name": "DB_HOST",
                    "value": "backend.backend.svc.cluster.local"
                  },
                  {
                    "name": "DB_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "db-secret",
                        "key": "password"
                      }
                    }
                  },
                  {
                    "name": "DB_USERNAME",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "db-secret",
                        "key": "username"
                      }
                    }
                  }
                ],
                "command": [
                  "nginx"
                ],
                "args": [
                  "-g",
                  "daemon off;",
                  "-c",
                  "/etc/nginx/lab/nginx.conf"
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": 8080
                  },
                  "initialDelaySeconds": 2,
                  "periodSeconds": 3
                },
                "volumeMounts": [
                  {
                    "name": "nginx-config",
                    "mountPath": "/etc/nginx/lab",
                    "readOnly": true
                  },
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ]
              }
            ],
            "serviceAccountName": "frontend-sa",
            "automountServiceAccountToken": false,
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 101,
              "runAsGroup": 101,
              "fsGroup": 101,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "volumes": [
              {
                "name": "nginx-config",
                "configMap": {
                  "name": "frontend-config"
                }
              },
              {
                "name": "tmp",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "backend",
        "namespace": "backend"
      },
      "spec": {
        "replicas": 1,
        "revisionHistoryLimit": 2,
        "selector": {
          "matchLabels": {
            "app": "backend"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "backend"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "backend",
                "image": "postgres:15",
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "512Mi"
                  }
                },
                "securityContext": {
                  "privileged": false,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "env": [
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "db-secret",
                        "key": "password"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "db-secret",
                        "key": "username"
                      }
                    }
                  },
                  {
                    "name": "PGDATA",
                    "value": "/var/lib/postgresql/data/pgdata"
                  }
                ],
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-c",
                      "pg_isready -U \"$POSTGRES_USER\" -d postgres"
                    ]
                  },
                  "initialDelaySeconds": 3,
                  "periodSeconds": 3
                },
                "volumeMounts": [
                  {
                    "name": "pgdata",
                    "mountPath": "/var/lib/postgresql/data"
                  },
                  {
                    "name": "pgsocket",
                    "mountPath": "/var/run/postgresql"
                  },
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ]
              }
            ],
            "serviceAccountName": "backend-sa",
            "automountServiceAccountToken": false,
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 999,
              "runAsGroup": 999,
              "fsGroup": 999,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "volumes": [
              {
                "name": "pgdata",
                "emptyDir": {}
              },
              {
                "name": "pgsocket",
                "emptyDir": {}
              },
              {
                "name": "tmp",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "frontend",
        "namespace": "frontend"
      },
      "spec": {
        "selector": {
          "app": "frontend"
        },
        "ports": [
          {
            "port": 80,
            "targetPort": 8080,
            "protocol": "TCP"
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "backend",
        "namespace": "backend"
      },
      "spec": {
        "selector": {
          "app": "backend"
        },
        "ports": [
          {
            "port": 5432,
            "targetPort": 5432,
            "protocol": "TCP"
          }
        ]
      }
    }
  ]
}
